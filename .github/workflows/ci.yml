name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DMP.slnx

      - name: Build
        run: dotnet build DMP.slnx -c Release --no-restore

      - name: Test
        run: dotnet test DMP.slnx -c Release --no-build --no-restore

      - name: Publish (verifies production publish pipeline)
        run: dotnet publish src/DMP.Web/DMP.Web.csproj -c Release -o publish-check
